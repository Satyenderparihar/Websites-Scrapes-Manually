<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Bookmark Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090a0f;
            --surface: #13151f;
            --surface-hover: #1a1d29;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(167, 139, 250, 0.4);
            --accent: #8b5cf6;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        header {
            text-align: center;
            padding: 30px 20px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 15px 0;
            background: linear-gradient(135deg, #a78bfa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .search-bar {
            max-width: 650px;
            margin: 0 auto 20px;
            position: relative;
        }
        .search-bar input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            color: white;
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: all 0.3s;
        }
        .search-bar::before {
            content: '🔍';
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
            font-size: 0.9rem;
        }
        .search-bar input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }
        
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 1000px;
            margin: 0 auto;
        }
        .filter-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }
        .filter-btn.active {
            background: rgba(139, 92, 246, 0.15);
            color: #d8b4fe;
            border-color: rgba(139, 92, 246, 0.5);
        }
        
        main {
            flex: 1;
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        
        /* Compact Card Design */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            position: relative;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            border-color: var(--border-hover);
            background: var(--surface-hover);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .card-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }
        .card-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            object-fit: contain;
            background: white;
            padding: 2px;
        }
        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-pricing {
            font-size: 0.6rem;
            background: rgba(167, 139, 250, 0.1);
            color: #c4b5fd;
            padding: 3px 8px;
            border-radius: 20px;
            white-space: nowrap;
            font-weight: 600;
            border: 1px solid rgba(167, 139, 250, 0.2);
            text-transform: uppercase;
        }
        .card-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .no-results {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            padding: 40px;
            grid-column: 1 / -1;
        }
    
        /* Contact Footer */
        .contact-footer {
            margin-top: auto;
            padding: 40px 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
            width: 100%;
        }
        .contact-header {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
        
        .contact-photo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #a78bfa;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            margin: 5px 0;
        }

        .contact-name {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f8fafc, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .contact-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }
        .contact-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            transition: all 0.2s ease;
        }
        .contact-btn:hover {
            transform: translateY(-3px) scale(1.02);
        }
        .contact-btn.whatsapp {
            background: #25D366;
            box-shadow: 0 5px 20px rgba(37, 211, 102, 0.25);
        }
        .contact-btn.whatsapp:hover {
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
        }
        .contact-btn.call {
            background: #3b82f6;
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.25);
        }
        .contact-btn.call:hover {
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }
        .contact-btn.telegram {
            background: #0088cc;
            box-shadow: 0 5px 20px rgba(0, 136, 204, 0.25);
        }
        .contact-btn.telegram:hover {
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.4);
        }


        .subcategory-header {
            grid-column: 1 / -1;
            margin: 15px 0 5px 0;
            color: var(--text-main);
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

</style>

ubcategory": "File Search & Processing \ud83d\udcc2", "title": "FilePursuit", "url": "https://filepursuit.com/", "description": "File Search Engine", "pricing": "Free", "emoji": "\ud83d\udee0\ufe0f", "domain": "https://filepursuit.com/"}, {"category": "Utilities", "subcategory": "File Search & Processing \ud83d\udcc2", "title": "PI7 Image Tool", "url": "https://image.pi7.org/", "description": "Image Processing Tool", "pricing": "Free", "emoji": "\ud83d\udee0\ufe0f", "domain": "https://image.pi7.org/"}];
        
        const grid = document.getElementById('linksGrid');
        const filtersContainer = document.getElementById('filtersContainer');
        const searchInput = document.getElementById('searchInput');

        let currentFilter = 'All';
        let searchQuery = '';

        // Extract unique categories, sorted
        const categories = ['All', ...new Set(linksData.map(item => item.category).filter(Boolean))].sort();

        // Render Filters
        function renderFilters() {
            filtersContainer.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${cat === currentFilter ? 'active' : ''}`;
                btn.textContent = cat;
                btn.onclick = () => {
                    currentFilter = cat;
                    renderFilters();
                    renderGrid();
                };
                filtersContainer.appendChild(btn);
            });
        }

        // Format Favicon URL using Google S2
        function getFavicon(url) {
            try {
                const domain = new URL(url).hostname;
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
            } catch(e) {
                return 'https://www.google.com/s2/favicons?domain=google.com&sz=64'; // fallback
            }
        }

        // Render Grid
        function renderGrid() {
            grid.innerHTML = '';
            
            const filtered = linksData.filter(item => {
                const matchesFilter = currentFilter === 'All' || item.category === currentFilter;
                
                if (!matchesFilter) return false;
                
                if (searchQuery.trim() === '') return true;

                // Robust Search Logic
                const searchLower = searchQuery.toLowerCase().trim();
                const textToSearch = `
                    ${item.title || ''} 
                    ${item.description || ''} 
                    ${item.category || ''} 
                    ${item.url || ''}
                `.toLowerCase();

                // Split search query by space to allow matching multiple words anywhere
                const searchWords = searchLower.split(/\s+/);
                return searchWords.every(word => textToSearch.includes(word));
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-results">No bookmarks found matching your criteria.</div>';
                return;
            }

            // Group by subcategory
            const groups = {};
            filtered.forEach(item => {
                const sub = item.subcategory || 'General Resources';
                if (!groups[sub]) groups[sub] = [];
                groups[sub].push(item);
            });

            const subKeys = Object.keys(groups).sort();
            
            subKeys.forEach(sub => {
                if (sub !== 'General Resources' || subKeys.length > 1) {
                    const header = document.createElement('div');
                    header.className = 'subcategory-header';
                    header.textContent = sub;
                    grid.appendChild(header);
                }

                groups[sub].forEach(item => {
                    const card = document.createElement('a');
                    card.href = item.url;
                    card.target = '_blank';
                    card.className = 'card';
                    card.title = item.description; // show full desc on hover
                    
                    const pricingHtml = item.pricing ? `<span class="card-pricing">${item.pricing}</span>` : '';
                    const faviconUrl = getFavicon(item.url);
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="card-title-group">
                                <img src="${faviconUrl}" alt="icon" class="card-icon" onerror="this.src='https://www.google.com/s2/favicons?domain=example.com&sz=64'">
                                <div class="card-title">${item.title}</div>
                            </div>
                            ${pricingHtml}
                        </div>
                        <div class="card-desc">${item.description}</div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        // Search Listener
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderGrid();
        });

        // Init
        renderFilters();
        renderGrid();
    </script>
