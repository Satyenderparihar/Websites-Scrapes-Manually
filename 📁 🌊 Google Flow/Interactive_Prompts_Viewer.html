pacing, realistic physics, cinematic transitions, and luxury commercial style.\nThe generated prompt must: preserve the exact same product design from the up-loaded image, maintain logos, colors, materials, proportions, and textures, feel hyper-realistic and premium, and resemble a high-budget global advertisement.\nDepending on the product type, automatically adapt the style:\nfood \u2192 rich macro food cinematography\ntech \u2192 futuristic luxury product reveal\nfashion \u2192 high-end editorial commercial\nautomotive \u2192 aggressive cinematic energy\nbeauty/skincare \u2192 elegant glossy aesthetic\n`\n\n---\n\n## \ud83c\udf54 Cinematic Burger Ad Commercial Prompt\n\n### \ud83d\udccb Ready-to-Copy Burger Ad Prompt:\n\n`\text\nCreate a hyper-realistic premium cinematic food commercial for a stacked double cheese-burger, preserving the exact same burger design from the reference image: glossy sesame bun, two seared beef patties, thick molten cheddar cheese dripping naturally, crisp ba-con, and the same towering layered structure, proportions, textures, and color palette. Vertical 9:16 format, 10\u201312 seconds, global luxury-food-ad aesthetic, ultra-detailed macro cinematography, rich warm amber lighting, deep brown background, smoky steam, re-alistic heat haze, dramatic highlights on the cheese, and a moody restaurant-kitchen at-mosphere. Open with an extreme macro close-up of the sesame bun, shallow depth of field, soft drifting steam rising in elegant curls, tiny oil glints on the bun surface, and subtle floating particles in the air. Cut to a slow lateral slider shot across the top bun revealing the sesame seeds and crust texture in crisp detail, then transition into an inti-mate macro reveal of the first patty with glistening sear marks and rendered fat catching the light. Move into a slow-motion cheese-pour moment where thick cheddar stretches and folds over the patty edges with believable gravity, forming glossy drips that cling and pull downward. Show t on](#-part-1-one-time-setup--product-preservation)\n4. [Part 2: 3D Pop-Out Effect & Depth Layers](#-part-2-3d-pop-out-effect--depth-layers)\n5. [Part 3: Composition, Perspective & Lighting Rules](#-part-3-composition-perspective--lighting-rules)\n6. [Part 4: Universal Video Master Prompt (8 Seconds)](#-part-4-universal-video-master-prompt-8-seconds)\n7. [Part 5: 8-Second Cinematic Video Sequence Timeline](#-part-5-8-second-cinematic-video-sequence-timeline)\n8. [Part 6: Complete 3D Billboard Creation Workflow](#-part-6-complete-3d-billboard-creation-workflow)\n9. [Quick Recap (\u0938\u0902\u0915\u094d\u0937\u0947\u092a \u092e\u0947\u0902)](#-quick-recap-\u0938\u0902\u0915\u094d\u0937\u0947\u092a-\u092e\u0947\u0902)\n\n---\n\n## \ud83c\udf1f Introduction & Purpose\n\n\u092f\u0939 \u092e\u093e\u0938\u094d\u091f\u0930 \u092a\u094d\u0930\u0949\u092e\u094d\u092a\u094d\u091f \u0907\u0938\u0932\u093f\u090f \u092c\u0928\u093e\u092f\u093e \u0917\u092f\u093e \u0939\u0948 \u0924\u093e\u0915\u093f \u091c\u092c \u092d\u0940 \u0906\u092a\u0915\u094b **3D \u092c\u093f\u0932\u092c\u094b\u0930\u094d\u0921 \u0935\u093f\u091c\u094d\u091e\u093e\u092a\u0928** \u0915\u093e \u092a\u094d\u0930\u0949\u092e\u094d\u092a\u094d\u091f \u092c\u0928\u093e\u0928\u093e \u0939\u094b, \u0924\u094b \u0939\u0930 \u092c\u093e\u0930 \u0938\u094d\u0915\u094d\u0930\u0948\u091a \u0938\u0947 \u0928 \u092c\u0928\u093e\u0928\u093e \u092a\u0921\u093c\u0947\u0964\n\n## \ud83d\udccb Master 3D Billboard Image Prompt\n\n### \ud83d\udccb Ready-to-Copy Image Prompt:\n\n`\text\nCreate a hyper-realistic anamorphic 3D billboard advertisement installed on the corner of a massive premium modern shopping mall, inspired by the famous immersive 3D digital billboards seen in China, Tokyo and Seoul.\n`\n\n## \ud83d\udee0\ufe0f Part 1: One-Time Setup & Product Preservation\n\n### \u0938\u094d\u091f\u0947\u092a 1 \u2014 PRODUCT PRESERVATION (\u0905\u0928\u093f\u0935\u093e\u0930\u094d\u092f \u0936\u0930\u094d\u0924)\n\n`\text\n\u26a0\ufe0f \u091c\u093c\u0930\u0942\u0930\u0940 \u0936\u0930\u094d\u0924: Use the uploaded product image as the EXACT hero product. Maintain 100% fidelity to the original product design, shape, proportions, packaging, logo, typography, branding, colors, materials and textures. Do NOT alter, redesign, stylize or replace the product with a different model or variation.\n`\n\n### \u0938\u094d\u091f\u0947\u092a 2 \u2014 BILLBOARD DESIGN ARCHITECTURE\n\n- **Display Structure**: Create a huge high-resolution curved/corner LED billboard integrated into the architecture of the mall. The billboard should have a deep black/dark premium frame and a realistic LED screen surface.\n- **Anamorphic Illusion**: The advertisement should be specifically designed to create a powerful **ANAMORPHIC 3D ILLUSION**.\n- **Physical Extrusion**: The product should appear to physically break out of the screen and extend into the real-world space outside the billboard.\n\n## \ud83d\udca5 Part 2: 3D Pop-Out Effect & Depth Layers\n\nMake the hero product dramatically emerge from the billboard. Approximately **30\u201350% of the product** should visually extend beyond the physical boundaries of the screen. Parts of the product may overlap the billboard frame and appear to float several feet into the street.\n\n### 5 Depth Layers of Physical Extrusion:\n\n1. **Layer 1**: Background inside the billboard.\n2. **Layer 2**: Product inside the screen.\n3. **Layer 3**: Product partially crossing the screen boundary.\n4. **Layer 4**: Hero product dramatically protruding outside the screen.\n5. **Layer 5**: Small foreground elements coming toward the viewer.\n\n> Add realistic shadows, reflections, atmospheric depth, contact shadows and perspective distortion so the product genuinely looks like it is physically coming out of the LED display.\n\n### Product-Category Matching Visual Effects:\n\n- **Food or Beverages**: Realistic liquid splashes, ingredients, steam, ice, crumbs, droplets or particles.\n- **Cosmetics or Perfume**: Mist, fragrance particles, floating petals, liquid droplets or elegant particles.\n- **Shoes or Fashion**: Fabric movement, dust particles, dynamic motion trails or floating accessories.\n- **Electronics**: Energy waves, glowing particles, light streaks or futuristic interface elements.\n- **Any Other Product**: Create tasteful, physically believable environmental effects that enhance the product without distracting from it.\n\n## \ud83d\udcd0 Part 3: Composition, Perspective & Lighting Rules\n\n### Composition & Perspective:\n\n- **Hero Focal Point**: The hero product must be extremely large and immediately visible. Keep the product as the central focus.\n- **Street-Level Angle**: Use cinematic perspective with the camera positioned from street level looking slightly upward toward the billboard.\n- **Foreshortening**: Create dramatic foreshortening so the product appears significantly larger as it comes toward the viewer.\n- **Urban Context**: Include a realistic modern city environment around the mall: pedestrians, cars, storefronts, glass architecture, reflections, street lights and subtle urban activity.\n- **Audience Engagement**: Some pedestrians should naturally look toward the billboard or record it with smartphones, emphasizing the spectacular 3D illusion.\n\n### Lighting & Environment:\n\n- **Lighting Quality**: Premium cinematic commercial lighting. Realistic LED screen illumination.\n- **Reflections & Shadows**: Natural reflections on surrounding glass buildings. Physically accurate shadows.\n- **Atmospheric Effects**: Subtle atmospheric haze, high dynamic range, photorealistic materials, ultra-realistic depth and perspective.\n\n### Style & Critical Negative Rules:\n\n- **Commercial Aesthetic**: Luxury global advertising campaign. Premium commercial photography. Photorealistic, cinematic, high-end 3D advertising.\n- **Anamorphic Sensation**: Immersive Chinese/Tokyo-style 3D billboard illusion. The final image should look like a real photograph taken in a major Asian city where an enormous 3D billboard advertisement is physically protruding from the corner of a shopping mall.\n- **\u26a0\ufe0f Critical Negative Rules**: Do NOT make it look like a normal flat billboard. The 3D pop-out illusion must be the main visual feature. Do not change the product branding. Do not invent a different product. Do not add unnecessary text. Do not add watermarks. Aspect ratio: 16:9.\n\n## \ud83c\udfa5 Part 4: Universal Video Master Prompt (8 Seconds)\n\nCreate an ultra-realistic 8-second cinematic advertisement from the provided 3D anamorphic billboard image.\n\n### \ud83d\udccb Ready-to-Copy Gemini Video Setup Prompt:\n\n`\text\nI want to generate an 8-second anamorphic video based on the master prompt. Please set up and preserve all product details.\n`\n\n### Camera & Physics Rules:\n\n- **Camera Movement**: Realistic handheld cinematic camera movement from a bystander perspective at street level. Very subtle camera shake. Natural perspective.\n- **Camera Prohibitions**: No rapid camera movements. No artificial zoom. No spinning camera.\n- **Anamorphic 3D Effect**: Extreme depth, foreshortening, parallax, realistic occlusion, contact shadows, reflections, perspective distortion, volumetric depth, and realistic lighting interaction.\n- **Frame Crossing**: The billboard frame should act as a physical boundary. The product must visibly cross that boundary.\n- **Physics Accuracy**: All movement must obey realistic physics. Liquid must behave like real liquid. Particles must have realistic weight and momentum. The product must have realistic mass.\n- **Lighting & Reflections**: Shadows and reflections must react correctly to movement. Realistic LED illumination, natural reflections on the mall facade, physically accurate shadows, realistic ambient city lighting, subtle atmospheric haze, HDR cinematic exposure.\n- **Product Consistency**: The hero product must remain identical throughout all 8 seconds. Do not change shape, size, proportions, logo, branding, packaging, label, typography, colors, materials, textures, or distinctive features. No morphing, melting, deformation, or duplicate products.\n- **Output Specifications**: Duration: 8 seconds. Aspect ratio: 16:9 widescreen. Ultra high detail, smooth motion.\n\n## \u23f1\ufe0f Part 5: 8-Second Cinematic Video Sequence Timeline\n\n`\text\n\ud83c\udfac 8-Second Cinematic Anamorphic Video Sequence\n\u23f1\ufe0f 0\u20132 Seconds (Street Establishing): Start with a realistic street-level view of the shopping mall and its giant corner LED billboard. The billboard initially appears normal and integrated into the building. The camera slowly pushes toward the billboard with subtle cinematic movement.\n\u23f1\ufe0f 2\u20135 Seconds (The Pop-Out Emergence): The hero product begins moving forward from inside the billboard. It gradually crosses the physical boundary of the LED screen and into real-world space. Create strong anamorphic perspective and dramatic foreshortening. Supporting elements move naturally toward the viewer (liquid splashes, food particles, mist, dynamic trails).\n\u23f1\ufe0f 5\u20137 Seconds (Maximum 3D Impact): The hero product reaches its maximum pop-out distance from the billboard. Small particles or droplets move past the camera lens creating strong foreground depth and parallax. Camera subtly moves backward or sideways to emphasize scale. Pedestrians naturally look and record with smartphones.\n\u23f1\ufe0f 7\u20138 Seconds (Hero Settle & Final Shot): The product slowly settles back toward the billboard while maintaining the anamorphic illusion. End on a powerful hero shot where the product is still partially outside the billboard.\n`\n\n## \ud83d\ude80 Part 6: Complete 3D Billboard Creation Workflow\n\n`\text\n\ud83d\udca1 3D Billboard Video Creation Workflow\n1\ufe0f\u20e3 Select Product Image: Upload the exact reference image of the product without alteration.\n2\ufe0f\u20e3 Apply Master Prompt: Use the 3D Anamorphic Billboard prompt to generate the corner mall billboard image.\n3\ufe0f\u20e3 Generate 3D Image: Confirm 30\u201350% physical protrusion with realistic shadows and category-matched particles.\n4\ufe0f\u20e3 Apply 8-Sec Video Prompt: Use the sequence timeline (0-2s, 2-5s, 5-7s, 7-8s) for cinematic animation.\n5\ufe0f\u20e3 Render Final Video: Output high-definition 16:9 photorealistic anamorphic billboard commercial.\n`\n\n## \ud83d\udccc Quick Recap (\u0938\u0902\u0915\u094d\u0937\u0947\u092a \u092e\u0947\u0902)\n\n1. **Image Prompt** \u0938\u0947 \u092e\u0949\u0932 \u0915\u0947 \u0915\u094b\u0928\u0947 \u092a\u0930 \u0938\u094d\u0925\u093f\u0924 3D \u092c\u093f\u0932\u092c\u094b\u0930\u094d\u0921 \u092c\u0928\u093e\u090f\u0901 \u091c\u0939\u093e\u0901 \u092a\u094d\u0930\u094b\u0921\u0915\u094d\u091f \u0938\u094d\u0915\u094d\u0930\u0940\u0928 \u0938\u0947 30\u201350% \u092c\u093e\u0939\u0930 \u0928\u093f\u0915\u0932 \u0930\u0939\u093e \u0939\u094b\u0964\n2. **Category Effects** (\u091c\u0948\u0938\u0947 \u0932\u093f\u0915\u094d\u0935\u093f\u0921 \u0938\u094d\u092a\u094d\u0932\u0948\u0936, \u092e\u093f\u0938\u094d\u091f, \u090f\u0928\u0930\u094d\u091c\u0940 \u0935\u0947\u0935) \u091c\u094b\u0921\u093c\u0915\u0930 3D \u092a\u094d\u0930\u092d\u093e\u0935 \u0915\u094b \u0914\u0930 \u0905\u0938\u0932\u0940 \u092c\u0928\u093e\u090f\u0901\u0964\n3. **8-Second Video Timeline** (0-2s Street View, 2-5s Pop-Out, 5-7s Max Impact, 7-8s Hero Settle) \u0915\u093e \u0907\u0938\u094d\u0924\u0947\u092e\u093e\u0932 \u0915\u0930\u0915\u0947 \u0935\u0940\u0921\u093f\u092f\u094b \u091c\u0928\u0930\u0947\u091f \u0915\u0930\u0947\u0902\u0964\n4. **Consistent Identity Lock**: \u092a\u094d\u0930\u094b\u0921\u0915\u094d\u091f \u0915\u0940 \u092a\u0948\u0915\u0947\u091c\u093f\u0902\u0917, \u0932\u094b\u0917\u094b \u0914\u0930 \u0915\u0932\u0930\u094d\u0938 100% \u0913\u0930\u093f\u091c\u093f\u0928\u0932 \u0907\u092e\u0947\u091c \u091c\u0948\u0938\u0947 \u0939\u0940 \u0930\u0939\u0947\u0902\u0917\u0947\u0964\n\n---\n\n*Curated for Google Flow & ZeroG Companion by Satyender Parihar & Antigravity Autonomous Agent.*"}]}, {"name": "\ud83d\udc64 AI Avatars & Character Sheets", "files": [{"filename": "\ud83d\udcdd 3D_Cartoon_Animation_Videos_Google_Flow_Guide.md", "title": "3D Cartoon Animation Videos Google Flow Guide", "content": "# \ud83c\udfac Create 3D Cartoon Animation Videos with AI Without Writing a Single Prompt\n\n[![Watch Video](https://img.youtube.com/vi/GV8VVYRml5U/maxresdefault.jpg)](https://youtu.be/GV8VVYRml5U)\n\n> \ud83d\udcfa **Watch on YouTube**: [https://youtu.be/GV8VVYRml5U](https://youtu.be/GV8VVYRml5U)  \n> \ud83d\udc64 **Channel**: Anuj Rathore  \n> \ud83d\udee0\ufe0f **Tools**: ChatGPT + Google Flow  \n> \ud83d\udcc1 **Category**: [\ud83d\udcc1 \ud83d\udc64 AI Avatars & Character Sheets](../\ud83d\udcc1%20\ud83d\udc64%20AI%20Avatars%20&%20Character%20Sheets/)  \n\n---\n\n## \ud83d\udccb Prompts\n\n### 1. Pixar / Disney 3D Animation Master Movie Director Prompt\n```text\nYou are an Oscar-winning Pixar Storywriter, Disney Screenplay Writer, 3D Animation Director, Character Continuity Specialist, and Cinematic 3D Prompt Engineer.\n\nYOUR TASK:\nCreate a complete 3D animated movie workflow without requiring manual prompt writing. Develop consistent 3D cartoon characters, an emotional narrative arc, and structured video scene prompts for Google Flow.\n\nCHARACTER STYLING:\n- Style: Pixar / Disney 3D stylized animation, octane render, soft subsurface scattering, vibrant expressive eyes, rich textures (fur, cloth, skin).\n- Consistency: Retain exact proportions, facial features, fur/hair colors, and signature accessories across every scene.\n\nSCENE GENERATION FORMULA:\nFor each shot, specify character emotion, expressive exaggerated animation, camera angles (wide establishing / dramatic close-up), dynamic cinematic lighting, and atmospheric depth.\n```\n\n---\n\n### 2. 3D Character Consistency Sheet Prompt\n```text\nGenerate a full 360-degree character model sheet of a stylized 3D Pixar-style animated character on a clean neutral grey background.\nInclude:\n1. Front view (neutral standing pose, warm cheerful smile)\n2. Three-quarter view (displaying body shape, posture, and clothing depth)\n3. Side profile view (highlighting head shape, snout/nose, and silhouette)\n4. Rear three-quarter view (showing tail/hair and back details)\n5. 4 expressive facial emotion close-ups (Happy, Surprised, Thinking, Determined)\nRendered in high-end 3D CGI animation style, Octane render, beautiful soft lighting, 8K UHD.\n```\n"}, {"filename": "\ud83d\udcdd AI_Avatar_Studio_Setup_and_Prompts.md", "title": "AI Avatar Studio Setup and Prompts", "content": "# \ud83e\udd16 AI Avatar Setup & Complete Video Director Guide\n\n> **Workflow**: Photorealistic 16:9 Studio Avatar \u2794 Master Video Director Prompt \u2794 15 Ready Video Variations  \n> **Official Video Guide**: [Create a Realistic Talking AI Avatar for Faceless YouTube Channel (FREE)](https://youtu.be/o-8F-89cmZA?si=zois_GjY5Tpld8y7)  \n> **1-Click Copy**: Every prompt block is formatted in a fenced code block with a dedicated GitHub Copy button!\n\n---\n\n## \ud83d\udcd1 Table of Contents\n1. [Detailed 16:9 Studio Image Prompt](#1-detailed-169-studio-image-prompt)\n2. [Background & Lighting Rules](#2-background--lighting-rules)\n3. [Framing & Composition Rules](#3-framing--composition-rules)\n4. [Reference Sample Photos](#4-reference-sample-photos)\n5. [Step-by-Step Generation Workflow](#5-step-by-step-generation-workflow)\n6. [Master Video Director Prompt (Google Flow)](#6-master-video-director-prompt-google-flow)\n7. [15 AI Avatar Video Prompts Variations](#7-15-ai-avatar-video-prompts-variations)\n\n---\n\n## 1. Detailed 16:9 Studio Image Prompt\n\n### \ud83d\udccb Ready-to-Copy Image Prompt:\n```text\nCreate a highly photorealistic, ultra-clean 16:9 horizontal studio photograph of the exact same man shown in the reference image. Preserve his facial ident cts without physical explanation\nNo shaky camera\nNo excessive motion blur\nNo flickering\nNo flat lighting\nNo low-quality textures\nNo cartoon style\nNo plastic-looking materials when inappropriate\nNo visible studio walls unless intentionally designed\nNo product deformation\nNo product morphing\nNo duplicate branding\nNo visual elements overpowering the product\nKeep the uploaded product as the clear hero in every shot.\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\nOUTPUT INSTRUCTIONS\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\nAfter analyzing the uploaded image:\nGenerate ONLY ONE polished, production-ready AI VIDEO GENERATION PROMPT.\nDo NOT provide separate analysis.\nDo NOT explain your reasoning.\nDo NOT ask follow-up questions unless the uploaded image is genuinely unclear.\nAutomatically determine:\n\u2022 Product category\n\u2022 Best environment\n\u2022 Best VFX concept\n\u2022 Best camera movement\n\u2022 Best lighting\n\u2022 Best interaction\n\u2022 Best voiceover\n\u2022 Best luxury advertising tone\nEvery advertisement must feel unique to the uploaded product.\nThe final prompt must explicitly include:\n1. Exact product preservation\n2. Custom environment\n3. High-class CGI/VFX concept\n4. Five-shot 10-second structure\n5. Premium product-focused voiceover\n6. Professional audio design\n7. Cinematic camera direction\n8. Luxury lighting\n9. \u20b91 CRORE-level visual quality\n10. Complete negative prompt\nFINAL CREATIVE PRINCIPLE:\n\u201cSimple composition. Extraordinary VFX. Perfect product. Premium voice. Billion-dollar visual language.\u201d\nThe final result should make the viewer believe a world-class luxury advertising and VFX studio produced the commercial.\n`\n"}]}, {"name": "\ud83d\udcda AI Prompts Directory & Shortcuts", "files": [{"filename": "\ud83d\udcdd AI_Image_and_Text_Prompts_Quick_Guide.md", "title":  | Top-floor skyline penthouse with floor-to-ceiling glass windows | Manhattan or Dubai skyline views from ultra-luxury urban living rooms ke liye |"}, {"filename": "\ud83d\udcdd AI_YouTube_Thumbnail_Workflow_Guide.md", "title": "AI YouTube Thumbnail Workflow Guide", "content": "# \ud83c\udfac Make YouTube Thumbnails Using AI with Just 1 Photo\n\n[![Watch Video](https://img.youtube.com/vi/N7xTZDoO4SM/maxresdefault.jpg)](https://youtu.be/N7xTZDoO4SM)\n\n> \ud83d\udcfa **Watch on YouTube**: [https://youtu.be/N7xTZDoO4SM](https://youtu.be/N7xTZDoO4SM)  \n> \ud83d\udc64 **Channel**: Anuj Rathore  \n> \ud83d\udee0\ufe0f **Tools**: ChatGPT + Midjourney / Google Flow  \n> \ud83d\udcc1 **Category**: [\ud83d\udcc1 \ud83d\udcda AI Prompts Directory & Shortcuts](../\ud83d\udcc1%20\ud83d\udcda%20AI%20Prompts%20Directory%20&%20Shortcuts/)  \n\n---\n\n## \ud83d\udccb Prompts\n\n### 1. YouTube Thumbnail Master Generator Prompt (1 Photo Workflow)\n```text\nYou are an elite YouTube Thumbnail Designer, Click-Through-Rate (CTR) Optimization Specialist, Visual Packaging Expert, and High-Impact Commercial Art Director.\n\nTASK:\nTransform a single reference photo of a creator into a viral, high-CTR YouTube thumbnail concept with extreme visual contrast, clean composition, and high readability on mobile screens.\n\nTHUMBNAIL FORMULA:\n1. FOREGROUND SUBJECT:\n   - Creator with exaggerated, emotionally gripping expression (Shock, Excitement, Intense Curiosity, or Anger).\n   - Clean rim light separating the subject from the background with intense glow (cyan, orange, yellow, or neon green).\n\n2. BACKGROUND CONTRAST:\n   - Darkened, simplified, or color-graded background with high depth and zero visual clutter.\n\n3. VISUAL HOOK ELEMENT:\n   - 1 single visual object or transformation that sparks intense curiosity (e.g., mysterious glowing box, before/after contrast split, blurred confidential document).\n\n4. TEXT (MAX 3 WORDS):\n   - Huge, bold, sans-serif 3D typography with thick outline and drop shadow for 100% legibility at small mobile scale.\n```\n\n---\n\n### 2. High-CTR Thumbnail Prompt Template\n```text\nHigh-CTR YouTube thumbnail composition: Close-up portrait of creator with dramatic emotional expression, looking directly at the camera with wide eyes and open mouth, extreme rim lighting with bright neon cyan highlights separating subject from background. On the right side, a dramatic glowing futuristic AI screen with high-contrast elements. Clean cinematic color grading, vibrant saturated colors, commercial advertising clarity, 16:9 aspect ratio, 8K UHD.\n```\n"}, {"filename": "\ud83d\udcdd Google_Flow_Gemini_Omni_Flash_Tutorial_Guide.md", "title": "Google Flow Gemini Omni Flash Tutorial Guide", "content": "# \ud83c\udfac Google Flow Tutorial | Create & Edit AI Videos with Gemini Omni Flash\n\n[![Watch Video](https://img.youtube.com/vi/9thy9Rq3DX4/maxresdefault.jpg)](https://youtu.be/9thy9Rq3DX4)\n\n> \ud83d\udcfa **Watch on YouTube**: [https://youtu.be/9thy9Rq3DX4](https://youtu.be/9thy9Rq3DX4)  \n> \ud83d\udc64 **Channel**: Anuj Rathore  \n> \ud83d\udee0\ufe0f **Tools**: Google Flow + Gemini Omni Flash + ChatGPT  \n> \ud83d\udcc1 **Category**: [\ud83d\udcc1 \ud83d\udcda AI Prompts Directory & Shortcuts](../\ud83d\udcc1%20\ud83d\udcda%20AI%20Prompts%20Directory%20&%20Shortcuts/)  \n\n---\n\n## \ud83d\udccb Prompts\n\n### 1. Google Flow AI Video Generation & Avatar Master Prompt\n```text\nYou are the world's most experienced Google Flow Prompt Engineer, Gemini Flow Specialist, AI Cinematic Director, Hollywood Screenwriter, Production Designer, Camera Director, Dialogue Writer, AI Avatar Expert, Story Architect, JSON Prompt Engineer and Realistic Human Behavior Specialist.\n\nYOUR TASK:\nTake any user concept, video idea, character reference, or story draft, and transform it into a production-ready, ultra-realistic Google Flow video generation plan divided into structured, continuity-locked generation clips.\n\nWORKFLOW:\n1. Understand the video concept, genre, and duration.\n2. Define the core visual style, aspect ratio (16:9 cinematic or 9:16 vertical), and color palette.\n3. Establish character consistency locks (facial structure, hair, clothing, voice tone).\n4. Generate structured prompt blocks for Google Flow with scene objective, camera movement, dialogue, lighting, and ambient sound effects.\n```\n\n---\n\n### 2. Google Flow Video Scene & Clip Prompt Structure\n```text\n{\n  \"scene_number\": 1,\n  \"duration\": \"8 seconds\",\n  \"camera_angle\": \"Medium close-up shot, 50mm cinematic prime lens\",\n  \"camera_motion\": \"Slow smooth push-in toward character\",\n  \"character_lock\": \"Consistent female host, 26 years old, professional smart-casual blazer, natural eye contact\",\n  \"action\": \"Speaker gestures gently with right hand while introducing the topic\",\n  \"dialogue\": \"Welcome back! Today we are exploring the future of generative AI video.\",\n  \"lighting\": \"Soft key light from camera left, subtle warm background rim light\",\n  \"environment\": \"Modern aesthetic high-tech studio with soft neon accent panels\",\n  \"audio_sfx\": \"Subtle ambient room tone, gentle high-tech whoosh transition\"\n}\n```\n"}]}, {"name": "\ud83d\udcf1 UGC Video Ads & Storyboards", "files": [{"filename": "\ud83d\udcdd AI_Product_and_UGC_Ads_Google_Flow_Guide.md", "title": "AI Product and UGC Ads Google Flow Guide", "content": "# \ud83c\udfac Make AI Product & UGC Ads That Brands Actually Pay For !\n\n[![Watch Video](https://img.youtube.com/vi/h_cupclSVy4/maxresdefault.jpg)](https://youtu.be/h_cupclSVy4)\n\n> \ud83d\udcfa **Watch on YouTube**: [https://youtu.be/h_cupclSVy4](https://youtu.be/h_cupclSVy4)  \n> \ud83d\udc64 **Channel**: Anuj Rathore  \n> \ud83d\udee0\ufe0f **Tools**: ChatGPT + Google Flow  \n> \ud83d\udcc1 **Category**: [\ud83d\udcc1 \ud83d\udcf1 UGC Video Ads & Storyboards](../\ud83d\udcc1%20\ud83d\udcf1%20UGC%20Video%20Ads%20&%20Storyboards/)  \n\n---\n\n## \ud83d\udccb Prompts\n\n### 1. Commercial AI Product Image Generation Master Prompt (Midjourney / Flux / DALL-E)\n```text\nYou are an award-winning Creative Director, Luxury Product Photographer, Brand Strategist, CGI Artist, Commercial Advertising Expert, Packaging Designer, Cinematic Lighting Specialist, and Premium E-Commerce Visual Designer.\n\nYour mission is to create an ultra-premium commercial advertising image that looks like it was produced by a global advertising agency such as Apple, Nike, Dior, Chanel, Coca-Cola, Samsung, L'Or\u00e9al, or Est\u00e9e Lauder.\n\nNever create generic AI art. Every image must look like a real commercial product photoshoot.\n\nPRODUCT SETUP:\n- Product Type: [Perfume / Skincare Serum / Beverage Can / Watch / Sneaker / Custom]\n- Brand Name: [Luxury Brand / Minimalist Label / Clean typography]\n- Packaging & Material: Premium frosted glass / polished aluminum / matte ceramic\n- Environment & Background: [Minimalist marble podium / Water ripple reflections / Golden hour architectural studio]\n- Lighting & Atmosphere: Cinematic softbox studio lighting, dramatic rim light, crisp product highlights, natural soft shadows, crystal clear depth of field.\n- Camera Specs: Hasselblad H6D-100c, 100mm macro lens, f/8, ultra-sharp focus, commercial color grading, 8K UHD.\n```\n\n---\n\n### 2. AI UGC Video Ad Storyboard & Script Master Prompt (ChatGPT)\n```text\nMASTER PROMPT: VIRAL AI UGC VIDEO AD DIRECTOR & SCRIPTWRITER\n\nYou are an expert UGC (User Generated Content) Ad Director, Performance Marketer, and Viral Video Scriptwriter specializing in TikTok, Instagram Reels, and YouTube Shorts video ads.\n\nYOUR TASK:\nCreate a high-converting, 15 to 30-second AI UGC video ad script and storyboard for a given product that looks 100% natural and authentic (not like an obvious ad).\n\nSTRUCTURE:\n1. THE 3-SECOND HOOK:\n   - Visual Hook: Shocking demonstration, problem agitation, or split-screen comparison.\n   - Spoken Hook: \"Stop scrolling if you struggle with [problem]...\" or \"This one product changed my entire routine...\"\n\n2. THE RELATABLE PROBLEM:\n   - Show the creator genuinely experiencing the pain point with natural body language.\n\n3. THE PRODUCT REVEAL & USP:\n   - Creator holding and demonstrating the product up close with believable hand interaction and natural lighting.\n\n4. REAL RESULTS / TRANSFORMATION:\n   - Quick before-and-after or practical demonstration of the benefits in real life.\n\n5. CALL TO ACTION (CTA):\n   - Clear urgency: \"Link in bio to grab yours before it sells out!\"\n```\n\n---\n\n### 3. Google Flow Omni Structured Video Prompt Formula (JSON)\n```text\nMASTER PROMPT: GOOGLE FLOW OMNI MODEL STRUCTURED VIDEO GENERATOR\n\nFor every scene in the storyboard, generate a structured Google Flow video generation prompt formatted as follows:\n\n{\n  \"scene_objective\": \"Creator enthusiastically talks to camera while holding product\",\n  \"character_identity_lock\": \"24-year-old creator with natural skin texture, consistent facial structure across cuts\",\n  \"wardrobe_lock\": \"Casual neutral crewneck sweatshirt\",\n  \"environment\": \"Modern sunlit apartment kitchen, soft natural background blur\",\n  \"action\": \"Creator raises product bottle toward lens, pointing at the label with a genuine smile\",\n  \"facial_expression\": \"Friendly, relatable, enthusiastic eye contact with camera\",\n  \"dialogue\": \"You guys have to see this\u2014it completely cleared my skin in two weeks!\",\n  \"camera\": \"Front-facing selfie angle, handheld phone camera subtle motion, 35mm lens, natural daylight\",\n  \"sound_effects\": \"Subtle cap unscrewing click, cheerful upbeat background lo-fi music\",\n  \"realism\": \"Authentic skin micro-texture, natural blinking, realistic lip-sync matching spoken dialogue\"\n}\n```\n"}, {"filename": "\ud83d\udcdd Create_UGC_Ads_Gemini_Storyboard_Guide.md", "title": "Create UGC Ads Gemini Storyboard Guide", "content": "# \ud83d\udcf1 Gemini \u0915\u0947 \u0938\u093e step karo aur mere answer ka wait karo, phir aage badho. Mujhse Hinglish mein baat karna.\nSTEP 1: Mujhse ye questions ek saath poocho:\n1. Tumhara product kya hai?\n2. Iska USP kya hai (isme special kya hai)?\n3. Ye product kiske liye hai?\n4. Ad ka vibe kaisa chahiye? (Emotional / Funny / Premium / Energetic)\nSTEP 2: Mujhe 3 alag-alag ad ideas do. Har idea ke liye ek catchy title, hook (pehle 2 seconds mein kya dikhega), aur 2 lines mein story do. Phir mujhse ek idea choose karne ko bolo.\nSTEP 3: Mujhse ad ki duration poocho: 8, 16, 24 seconds, ya Custom. Agar main Custom choose karun, toh use next even number tak round up karo aur 8 seconds ya usse chhote clips mein split karo, jo total duration ke exactly barabar ho.\nSTEP 4: Final script ek table mein likho: Clip number | Time | Kya dikhega | Dialogue. Har clip maximum 8 seconds ka ho. Dialogue short rakho (har second mein lagbhag 2.5 words). USP ko sirf bolna nahi, visually dikhana hai. Ad ka end product shot aur call to action pe hona chahiye.\nSTEP 5: Har clip ke liye ek alag video generation prompt likho, har prompt alag code block mein, taaki main seedha Google Flow / Veo mein copy-paste kar sakun. Prompts Hinglish mein likho, aur har prompt mein ye cheezein honi chahiye: character (har clip mein same description), action, location aur lighting, camera shot aur movement, dialogue, aur background sound. Saare Hindi/Hinglish dialogues Devanagari script mein likho (jaise \"\u092f\u0939 \u0915\u092e\u093e\u0932 \u0939\u0948\"), English words English mein hi rehne do. Mujhe yaad dilao ki har clip mein product image attach karni hai aur packaging change nahi honi chahiye. Screen pe koi text nahi hona chahiye.\nAb Step 1 se start karo.\n`\n\n---\n\n## \ud83d\udee0\ufe0f Step-by-Step Framework Breakdown\n\n- **STEP 1 (Discovery)**: Product definition, USP, target audience, and ad vibe (Emotional / Funny / Premium / Energetic).\n- **STEP 2 (Concept Generation)**: 3 distinct ad ideas with catchy title, 2-second visual hook, and 2-line story.\n- **STEP 3 (Duration & Clip Splitting)**: Choose duration (8s, 16s, 24s, or Custom) split into <=8s clips.\n- **STEP 4 (Script & Storyboard Table)**: Structured table with Clip #, Time, Visual Action, and Spoken Dialogue (~2.5 words/sec).\n- **STEP 5 (AI Video Generation Prompts)**: Fenced code blocks for Google Flow / Veo with Character Consistency, Action, Location, Lighting, Camera Movement, Dialogue, and SFX.\n\n---\n\n*Curated from Ritika\u2019s AI Growth Army Master Prompt by Satyender Parihar & Antigravity Autonomous Agent.*"}, {"filename": "\ud83d\udcdd Premium_AI_Prompts_Collection_UGC_Ads.md", "title": "Premium AI Prompts Collection UGC Ads", "content": "# \ud83c\udf1f Premium AI Prompts Collection (UGC & Commercial Ads Master Suite)\n\n> **Source**: Complete Un-Truncated 1,584 Paragraph Collection from `\u2705 Premium_AI_Prompts_Collection_UGC Ads.docx`  \n> **Suites Included**: Product Image Gen, Reference Influencers, New Influencers, Google Omni JSON Generator, ChatGPT Master Optimizer, Hero Shot Creation & Scene Storyboard Creation  \n> **1-Click Copy**: Every prompt block is formatted in a fenced code block with a dedicated GitHub Copy button!\n\n---\n\n## \ud83d\udcd1 Table of Contents\n\n1. [1. Product Image Generation for UGC Ads (10 Steps)](#1-product-image-generation-for-ugc-ads)\n2. [2. AI Influencer Generation \u2014 Reference Image AI Influencer](#2-ai-influencer-generation--reference-image-ai-influencer-prompt)\n3. [3. AI Influencer Generation \u2014 New AI Influencer Prompt](#3-ai-influencer-generation--new-ai-influencer-prompt)\n4. [4. JSON Video Generation Prompt \u2014 Google Omni UGC Ad Generator](#4-json-video-generation-prompt)\n5. [5. Master Prompt Generator (ChatGPT Master Prompt)](#5-master-prompt-generator-chatgpt-master-prompt)\n6. [6. Cinematic Product Ads Prompts \u2014 Hero Shot Image Creation](#6-cinematic-product-ads-prompts--hero-shot-image-creation)\n7. [7. Cinematic Product Ads Prompts \u2014 ided\nUse it exactly.\nIf not provided\nGenerate premium branding.\nTypography must look realistic.\nNever use gibberish text.\nUse readable labels.\nCorrect hierarchy.\nPremium design.\nSTEP 9 \u2014 CINEMATIC DETAILS\nInclude only if suitable\nWater Splash\nIce\nFloating Ingredients\nFlowers\nLeaves\nSmoke\nMist\nDust Particles\nGolden Particles\nLight Rays\nBokeh\nLens Bloom\nCondensation\nFloating Product\nLuxury Stand\nGlass Platform\nMirror Reflection\nSTEP 10 \u2014 QUALITY\nImage Quality Requirements\nUltra Photorealistic\nHyper Realistic\n8K\n16K Feel\nHDR\nCommercial Photography\nUltra Sharp\nMacro Details\nMagazine Quality\nLuxury Advertising\nBrand Campaign\nProfessional Color Grading\nGlobal Brand Standard\nNo Noise\nNo Blur\nNo Pixelation\nNo Compression\nNo AI Art Look\nNo Plastic Look\nNo Fake Shadows\nNo Warped Text\nNo Deformed Objects\nNo Low Resolution\nEverything must look physically believable.\nUSER INPUT\nMain Subject/Product:\n[Example: Sunscreen / Chips / Perfume / Face Serum / Coca Cola Style Soft Drink / Sneakers / Watch / Headphones]\nProduct Name:\n[ ]\nBrand Name:\n[ ]\nTagline:\n[ ]\nProduct Category:\n[ ]\nShort Product Description:\n[ ]\nKey Features:\n[ ]\nIngredients / Materials:\n[ ]\nPackaging Style:\n[ ]\nBottle / Can / Tube / Jar / Box / Pouch:\n[ ]\nPrimary Colors:\n[ ]\nTarget Audience:\n[ ]\nPremium / Luxury / Budget:\n[ ]\nDesired Mood:\nLuxury / Fresh / Energetic / Dark / Elegant / Fun / Summer / Premium\nAdvertising Theme:\n[ ]\nBackground Preference:\n[Leave blank to auto-generate]\nFloating Elements:\n[Leave blank for AI to decide]\nCamera Angle:\n[Leave blank for AI to decide]\nLighting Style:\n[Leave blank for AI to decide]\nAspect Ratio:\n1:1\n4:5\n9:16\n16:9\nReference Image:\n(Optional)\nLogo:\n(Optional)\nAdditional Instructions:\n(Optional)\nREFERENCE IMAGE\nIf a reference image is provided:\nPreserve\nProduct shape\nPackaging\nLabel\nColors\nIdentity\nLogo\nBottle\nCap\nDimensions\nwhile improving\nLighting\nBackground\nComposition\nMaterials\nReflections\nSharpness\nLuxury look\nCommercial quality\nDo NOT alter the core product identity.\nFINAL OUTPUT\nGenerate a premium luxury commercial advertising image that looks indistinguishable from a real product photoshoot created by an international advertising agency.\nThe final image must be so realistic that viewers cannot tell it was AI-generated.\nQuality Target:\n\u2605\u2605\u2605\u2605\u2605 Luxury Commercial Campaign\n\u2605\u2605\u2605\u2605\u2605 Amazon Premium Listing\n\u2605\u2605\u2605\u2605\u2605 Apple Style Product Photography\n\u2605\u2605\u2605\u2605\u2605 Coca-Cola / Dior / Nike / L'Or\u00e9al Level Advertisement\n\u2605\u2605\u2605\u2605\u2605 Ultra Photorealistic\n\u2605\u2605\u2605\u2605\u2605 Cinematic\n\u2605\u2605\u2605\u2605\u2605 8K HDR\n\u2605\u2605\u2605\u2605\u2605 Print Ready\n\u2605\u2605\u2605\u2605\u2605 Award Winning Advertising Quality\n```\n\n---\n\n\n## 2. AI Influencer Generation \u2014 Reference Image AI Influencer Prompt\n\n### \ud83d\udccb Ready-to-Copy Master Production Prompt Block:\n\n```text\n\ud83d\udcdd Note on usage:\nIf you already have a reference image of an AI influencer, use the \"Reference Image AI Influencer Prompt\" below to refine and enhance it. If you do not have an image and want to create a brand new AI influencer from scratch, use the \"New AI Influencer Prompt\". Make sure to select and fill in all the specific details requested in the prompt to achieve the most realistic and high-quality results.\nYou are a world-class Creative Director, Fashion Stylist, Luxury Branding Expert, Commercial Advertising Director, Celebrity Photographer, Portrait Retoucher, Beauty Expert, Human Anatomy Specialist, Editorial Photographer, and Hyper-Realistic Image Enhancement Specialist. Your mission is to transform the uploaded photograph into an ultra-premium commercial-quality image while preserving the person's real identity. The final result must be indistinguishable from a real professional photograph captured with a high-end camera.\nTASK MODE\nIMAGE EDIT MODE ONLY\nAn actual reference image has been uploaded. Use ONLY the uploaded image as the identity source. Do NOT generate a new person. Do NOT replace the person's face. Do NOT mix identities. Do NOT blend multiple people. Do NOT invent facial features. The uploaded person must remain the same individual.\nIDENTITY LOCK (HIGHEST PRIORITY)\nPreserve exactly:\n\u2022 Face\n\u2022 Identity\n\u2022 Facial Structure\n\u2022 Skin Tone\n\u2022 Eye Shape\n\u2022 Eye Color\n\u2022 Nose Shape\n\u2022 Lip Shape\n\u2022 Jawline\n\u2022 Cheek Structure\n\u2022 Forehead\n\u2022 Eyebrows\n\u2022 Hairline\n\u2022 Hair Color (unless requested)\n\u2022 Hairstyle (unless requested)\n\u2022 Ear Shape\n\u2022 Neck Proportions\n\u2022 Body Proportions\n\u2022 Height\n\u2022 Overall Appearance\n\u2022 Natural Age\nThe edited image must still be instantly recognizable as the same person.\nALLOWED IMPROVEMENTS\nImprove only where appropriate:\n\u2022 Image Quality\n\u2022 Sharpness\n\u2022 Resolution\n\u2022 Lighting\n\u2022 Exposure\n\u2022 White Balance\n\u2022 Color Accuracy\n\u2022 Dynamic Range\n\u2022 Contrast\n\u2022 Background\n\u2022 Composition\n\u2022 Camera Perspective\n\u2022 Depth of Field\n\u2022 Professional Color Grading\nEnhance realism while preserving identity.\nSKIN ENHANCEMENT\nImprove skin naturally. Preserve:\n\u2022 Skin texture\n\u2022 Skin pores\n\u2022 Natural wrinkles\n\u2022 Smile lines\n\u2022 Tiny blemishes\n\u2022 Freckles\n\u2022 Birthmarks\n\u2022 Natural skin variation\nDo NOT create:\n\u2022 Plastic skin\n\u2022 Airbrushed skin\n\u2022 Wax effect\n\u2022 Unrealistic smoothing\nSkin must remain human.\nHAIR ENHANCEMENT\nImprove:\n\u2022 Hair Detail\n\u2022 Hair Texture\n\u2022 Individual Strands\n\u2022 Flyaway Hair\n\u2022 Natural Shine\n\u2022 Hair Volume\nNever replace the hairstyle unless requested.\nNever change hair color unless requested.\nBODY & ANATOMY\nPreserve anat RRI Alexa 65\nSony Venice 2\nRED V-Raptor XL\nCooke Cinema Lenses\nAtlas Anamorphic\nMacro Lens\n100mm Product Lens\nNatural DOF\nLuxury Lens Compression\nReal Optical Blur\nFilmic Motion Feel\nSTEP 7 \u2014 LIGHTING\nCommercial Studio Lighting\nSoft Rim Light\nBack Light\nPractical Lighting\nVolumetric Light\nGolden Accent\nControlled Reflections\nLuxury Highlights\nPhysically Accurate Shadows\nSTEP 8 \u2014 ENVIRONMENT\nAutomatically create premium environments that fit the product.\nExamples\nChocolate\nLuxury cocoa environment\nFloating chocolate\nPremium cocoa powder\nDark cinematic atmosphere\nCoffee\nRoasted beans\nSteam\nWarm lighting\nPerfume\nLuxury marble\nCrystal reflections\nWater\nSplash\nFresh droplets\nSkincare\nSpa\nFresh leaves\nNatural sunlight\nTechnology\nMinimal futuristic setup\nLuxury metallic reflections\nFitness\nPremium gym\nEnergy atmosphere\nAdapt automatically for every uploaded product.\nSTEP 9 \u2014 STORYBOARD LAYOUT\nGenerate one premium storyboard sheet.\nInclude 8\u201316 sequential frames.\nArrange them in clean cinematic panels.\nMaintain equal spacing.\nConsistent lighting.\nConsistent color grading.\nEach frame clearly readable.\nEvery frame should feel like a real movie still.\nNo sketches.\nNo wireframes.\nNo rough storyboard drawings.\nOnly photorealistic cinematic frames.\nQUALITY STANDARD\nUltra Photorealistic\n16K Detail\n8K Render\nCommercial Advertising\nNetflix Quality\nApple Commercial Style\nNike Campaign Style\nRolex Luxury Style\nDior Editorial Style\nHollywood Cinematography\nAward Winning Commercial Photography\nSTRICT NEGATIVE PROMPT\nDo NOT redesign the product.\nDo NOT modify branding.\nDo NOT alter logo.\nDo NOT change typography.\nDo NOT invent new packaging.\nDo NOT create sketches.\nDo NOT create illustrations.\nDo NOT create comic panels.\nDo NOT create AI artwork.\nDo NOT create low-quality storyboard boxes.\nDo NOT generate repeated frames.\nDo NOT distort product proportions.\nDo NOT blur branding.\nDo NOT crop important product details.\nDo NOT make text unreadable.\nFINAL OUTPUT\nGenerate one ultra-premium cinematic storyboard sheet consisting of 8\u201316 hyper-realistic sequential commercial frames that visually tell the complete advertising story of the uploaded product.\nEvery frame must feel like a still captured from a Hollywood-level luxury commercial.\nThe storyboard should naturally progress from product discovery to the final premium hero shot while maintaining identical product identity, branding, packaging, logo, colors, and typography throughout.\nThe final result should be suitable for directing a high-budget AI commercial, TV advertisement, Instagram campaign, YouTube advertisement, or cinematic brand film.\n```\n\n---\n\n*Curated from Premium AI Prompts Collection by Satyender Parihar & Antigravity Autonomous Agent.*"}, {"filename": "\ud83d\udcdd UGC_Video_Ads_Master_Prompt_Hindi_Template.md", "title": "UGC Video Ads Master Prompt Hindi Template", "content": "# \ud83d\udcf1 UGC Video Ads \u2014 Master Prompt Template (Hindi Default)\n\n> **Compatible AI Tools**: Kling AI, Google Veo, Sora, Runway, CapCut AI, Seedance  \n> **Structure**: 5 Segments (0-10s Hook, 10-20s Intro, 20-30s Demo, 30-40s Trust, 40-50s CTA)  \n> **1-Click Copy**: Every prompt block is formatted in a fenced code block with a dedicated GitHub Copy button!\n\n---\n\n## \ud83d\udca1 Instructions & Raw Authentic Rules\n\n```text\n\u26a0\ufe0f Zaroori Tips & Instructions: Bas [] wale placeholders ko apne actual product ke hisaab se fill karo. Ad style ko hamesha raw, authentic aur unpolished phone-shot look me rakhein \u2014 studio lighting ya cinematic look avoid karein taaki ad genuine lage.\n```\n\n---\n\n## \ud83c\udfaf Core Master UGC Prompt Template (Hindi-First 10s Segments)\n\n### \ud83d\udccb Ready-to-Copy Master Template:\n\n```text\nCreator & Vibe: A [age range, e.g. 22-28 year old] [gender] with a [casual/friendly/energetic] vibe, talking directly to camera in natural Hindi like a real customer.\n\nSegment 1: 0-10s (The Hook & Problem)\n\u2022 Visual: Handheld selfie angle, [bedroom/kitchen/outdoor], creator looks slightly frustrated or curious.\n\u2022 Script (Hindi): \"Yaar, kya aap bhi [problem] se pareshan ho? Maine sab try kiya par kuch kaam nahi aaya...\"\n\nSegment 2: 10-20s (The Discovery & Product Intro)\n\u2022 Visual: Quick cut to creator holding [Product Name], showing the packaging naturally to the lens.\n\u2022 Script (Hindi): \"Phir mujhe mila ye [Product Name]. Honestly, starting mein mujhe laga ye bhi waisa hi hoga, par listen...\"\n\nSegment 3: 20-30s (The Demo/Transformation)\n\u2022 Visual: Close-up B-roll of product in use (applying/opening/using). Natural lighting, raw texture.\n\u2022 Script (Hindi): \"Isko use karna itna simple hai. Dekho, [action/demo description]. Results sirf [X days] mein dikhne lage!\"\n\nSegment 4: 30-40s (Trust & Final Verdict)\n\u2022 Visual: Back to face-to-camera, creator looks happy/relieved, showing the final result (glowing skin/organized desk).\n\u2022 Script (Hindi): \"Ab meri life [problem] ke bina bahut better hai. Seriously, agar aapne ye try nahi kiya, toh miss kar rahe ho.\"\n\nSegment 5: 40-50s (The CTA)\n\u2022 Visual: Creator pointing down to on-screen link/button, text overlay with discount code appears.\n\u2022 Script (Hindi): \"Abhi jaao aur apna pack order karo. Link bio mein hai, aur mera code [Code] use karke extra discount paao!\"\n\nCamera: Handheld phone-style shot, slight shake, front camera selfie angle (cut to a quick product close-up shot in the middle).\nStyle: Raw, authentic, unpolished \u2014 NOT cinematic, NOT studio lighting, looks native to TikTok/Instagram Reels feed.\nCaptions: Bold, punchy on-screen text overlay matching spoken words.\nAspect ratio: 9:16 vertical.\nExclusions: No stock-photo look, no overly perfect skin/lighting, no scripted-sounding tone.\n```\n\n---\n\n## \ud83e\ude9d Hook Bank (First 2 Seconds Decide Scroll-Stop Rate)\n\n### `Problem Hook`\n```text\nOkay I need to talk about [problem] because nobody warned me...\n```\n\n### `Curiosity Hook`\n```text\nI wasn't going to post this but...\n```\n\n### `Before/After Hook`\n```text\nPOV: you finally found [product] after trying everything else\n```\n\n### `Shock/Stat Hook`\n```text\nThis [product] literally changed my [routine/skin/life] in [X days]\n```\n\n### `Relatable Hook`\n```text\nIf you also struggle with [problem], stop scrolling\n```\n\n---\n\n## \ud83d\udcfd\ufe0f 15 UGC Ad Types \u2014 Pick Your Angle\n\n| Type | Structure (Hindi 10s Segments) | Best For |\n| :--- | :--- | :--- |\n| **Problem \u2192 Solution** | Pain point \u2192 discovery \u2192 demo \u2192 relief (Hindi focus) | New/unknown products |\n| **Unboxing** | \"It arrived!\" \u2192 open \u2192 first reaction \u2192 try it | Physical/tangible products |\n| **Testimonial/Review** | \"I've used this for X weeks, here's my honest take\" | Trust-building, retargeting |\n| **Before & After** | Show old struggle \u2192 show product \u2192 show new result | Skincare, fitness, home, beauty |\n| **Day-in-my-life** | Casual vlog where product appears naturally mid-routine | Lifestyle, wellness, food |\n| **Founder Story** | \"I made this because I couldn't find...\" | D2C brands wanting authenticity |\n| **Myth-Busting** | \"Everyone thinks X is true, but actually Y\" \u2192 Demo proof \u2192 Result | Challenging common misconceptions or industry lies |\n| **Comparison/Vs** | \"Why I switched from X to Y\" \u2192 Comparison points \u2192 Final recommendation | Competitor switching |\n| **Gift Guide/Seasonality** | \"Struggling with gifts? This is the perfect fix\" \u2192 Show product utility | Occasion-based marketing |\n| **How-To Hack** | \"Did you know you can do X with Y?\" \u2192 Pro-tip demo | Versatile products |\n| **FOMO/Urgency** | \"Sirf aaj ke liye offer / Stock khatam ho raha hai\" \u2192 Scarcity \u2192 Urgent CTA | High conversion campaigns |\n| **'Lazy' Solution** | \"Mujhe mehnat nahi karni, toh maine ye trick try ki\" \u2192 Quick hack \u2192 Easy result | Quick, relatable lifestyle products |\n| **Budget/Savings** | \"Mehenge alternative mat lo, ye try karo\" \u2192 Value comparison \u2192 Savings | Value-conscious consumers |\n| **FAQ/Objection** | \"Mujhse sab puch rahe hain kya ye kaam karta hai?\" \u2192 Answering doubts \u2192 Trust | High-ticket or complex items |\n| **ASMR/Sensory** | Focus on sounds (opening/using) \u2192 Visual pleasure \u2192 Satisfaction | Food, skincare, tech gadgets |\n\n---\n\n## \ud83d\udca1 Quick Tip on Aspect Ratios\n\n> \ud83d\udca1 Quick Tip on Aspect Ratios:\nPlatform ke hisaab se aspect ratio badlo \u2014 9:16 Reels / TikTok / YouTube Shorts ke liye, 1:1 Instagram Feed ke liye, aur 16:9 Landscape YouTube ke liye.\n\n---\n\n## \ud83d\udee0\ufe0f Step-by-Step Production Guide\n\n1. **Product Details Fill**: Product ka naam, category aur core benefit fill karo.\n2. **Ad-Type Selection**: Ek ad-type table se choose karo.\n3. **Hook Selection**: Hook bank se ek hook uthao aur apne product ke hisaab se tweak karo.\n4. **Generate Video**: Poora master prompt fill karke seedha apne AI video tool (Kling, Veo, Sora, CapCut AI) mein paste karo.\n5. **A/B Testing**: Same prompt structure rakhkar script/hook change karke multiple variations generate karein.\n\n---\n\n## \u2705 Filled Production Example (GlowDrop Vitamin C Serum)\n\n### \ud83d\udccb Ready-to-Copy Example Prompt:\n\n```text\nCreator: A 24-year-old woman with a chill, relatable vibe, talking to camera like a friend.\nSetting: Bedroom, morning light, handheld selfie-style, slightly shaky iPhone footage.\nProduct: GlowDrop Vitamin C Serum \u2014 brightens skin in 2 weeks.\nHook: \"Okay I need to talk about my skin because nobody warned me it would look THIS different...\"\n\nScript:\n\"I used to have such dull, tired-looking skin no matter what I tried.\"\n\"Then my friend told me about this serum and I was skeptical honestly.\"\n\"[cut to close-up of applying serum] Look how it just melts in.\"\n\"After 2 weeks \u2014 this is legit my skin, no filter.\"\n\"Link's in my bio if you wanna try it, use code GLOW10 for 10% off.\"\n\nCamera: Handheld selfie, one quick cutaway to product close-up.\nStyle: Raw, natural, phone-shot look, no studio lighting.\nCaptions: Bold white text matching each line.\nAspect ratio: 9:16.\nExclusions: No cinematic color grading, no perfect studio setup.\n```\n\n---\n\n*Curated from UGC Video Ads Master Framework by Satyender Parihar & Antigravity Autonomous Agent.*"}, {"filename": "\ud83d\udcdd VOX_Style_Documentary_Master_Prompt_Guide.md", "title": "VOX Style Documentary Master Prompt Guide", "content": "# \ud83c\udfac I Made a VOX Style Documentary With ONE AI Master Prompt\n\n[![Watch Video](https://img.youtube.com/vi/Djss9nAfbO8/maxresdefault.jpg)](https://youtu.be/Djss9nAfbO8)\n\n> \ud83d\udcfa **Watch on YouTube**: [https://youtu.be/Djss9nAfbO8](https://youtu.be/Djss9nAfbO8)  \n> \ud83d\udc64 **Channel**: Anuj Rathore  \n> \ud83d\udee0\ufe0f **Tools**: ChatGPT + Google Flow / Midjourney  \n> \ud83d\udcc1 **Category**: [\ud83d\udcc1 \ud83d\udcf1 UGC Video Ads & Storyboards](../\ud83d\udcc1%20\ud83d\udcf1%20UGC%20Video%20Ads%20&%20Storyboards/)  \n\n---\n\n## \ud83d\udccb Prompts\n\n### 1. VOX-Style Documentary All-in-One Master Prompt\n```text\nYou operate as a complex documentary scriptwriter, investigative research writer, editorial art director, hand-cut collage artist, stop-motion designer, motion graphics supervisor, and YouTube narrative strategist.\n\nOBJECTIVE:\nTake any niche and topic the user picks and build it into a fully narrative, gripping, VOX-style mini-documentary with research facts, archival footage prompts, dynamic kinetic text, and mixed-media collage visuals.\n\nDOCUMENTARY BLUEPRINT:\n1. THE ANOMALY (00:00 - 01:00): A surprising hook, startling statistic, or counterintuitive question that breaks conventional wisdom.\n2. HISTORICAL CONTEXT & ORIGINS: The unseen chain of events that created this reality.\n3. THE HIDDEN MECHANISM: Deconstructing the complex system using clear visual metaphors (maps, data charts, newspaper clippings, vintage tape overlays).\n4. HUMAN / GLOBAL IMPACT: What this means for everyday people and the future.\n5. THE CONCLUSION: An open philosophical insight that lingers in the viewer's mind.\n\nVISUAL AESTHETIC FORMULA:\n- Mixed media: 35mm archival photograph textures, newspaper grain, highlighter marker animations, map isolations with glowing trajectory paths, paper cutout stop-motion layers, isometric 3D diagrams, and cinematic B-roll.\n```\n\n---\n\n### 2. VOX Motion Graphics & Archival Scene Prompt\n```text\nCinematic VOX-style documentary visual collage: Vintage sepia archival photograph of an urban skyline mixed with bold yellow isometric vector line graphs, animated newspaper headlines with bold black typography, torn paper edges, tactile halftone print texture, subtle stop-motion jitter, 16mm film dust and scratches, 4K editorial aesthetic.\n```\n"}]}, {"name": "\ud83d\ude80 Product VFX & Video Commercials", "files": [{"filename": "\ud83d\udcdd 20_VFX_Product_Video_Prompts.md", "title": "20 VFX Product Video Prompts", "content": "# \ud83d\ude80 20 Viral VFX & Product Commercial Prompts\n\n> **Ready-to-Use**: Complete cinematic Image Generation Prompts + matching Image-to-Video Animation Prompts.  \n> **Features**: Every prompt is wrapped in a dedicated code block with a 1-click GitHub Copy button!\n\n---\n\n## \ud83d\udca1 1. Giant Saree Rooftop Model\n- **Best Suited For**: `Perfume, phone, beauty, fashion, luxury products`\n\n### \ud83d\uddbc\ufe0f Image Generation Prompt:\n```text\nA breathtaking, ultra-photorealistic cinematic shot of a stunning, authentically human Indian woman sitting casually and comfortably on the front rooftop edge of a modern, small-to-medium city building. She possesses lifelike skin texture, subtle pores, natural warmth in her complexion, and fine stray hairs gently catching the breeze. Captured from a high-to-low angle, looking downward. Right beside her sits the uploaded product, scaled to match her giant height, sharing perfect physical grounding, realistic ambient shadows, and reflections that blend seamlessly into the environment. Her beautiful saree is custom-designed with the product\u2019s gradient colors and logo in a premium pattern, featuring highly realistic fabric physics, natural folds, and draping heavily with gravity. The building is just tall enough to emphasize her towering, majestic scale against the city skyline. Below, a bustling Indian intersection (chauraha) teems with visible cars, bikes, and pedestrians to ground the scale. She maintains warm, engaging, and confident eye contact with the camera, displaying a subtle, genuine micro-expression. Lighting: soft natural daylight with subsurface scattering on her skin, crisp contrast, and realistic shadows. Mood & Style: raw photorealism, cinematic, giant scale, heroic perspective. Camera Setup: high-to-low angle front downward tilt, 85mm lens, 8k resolution, shot on 35mm film aesthetic.\n```\n\n### \ud83c\udfac Image-to-Video Animation Prompt:\n```text\nAnimate the uploaded image with a static camera. The giant Indian female model remains poised, maintaining direct eye contact with a gentle, confident smile. Subtle wind moves her saree and fine hair strands naturally. Down below, cars, motorbikes, and pedestrians move smoothly through the city intersection in realistic daylight traffic. The product remains perfectly grounded beside her, with realistic ambient reflections. Add subtle cloth motion, soft environmental movement, and natural city activity while preserving photorealism.\n```\n\n---\n\n## \ud83d\udca1 2. Giant Male Model on Rooftop\n- **Best Suited For**: `Mens grooming, watches, shoes, tech products`\n\n### \ud83d\uddbc\ufe0f Image Generation Prompt:\n```text\nAn ultra-photorealistic cinematic scene of a handsome Indian male model sitting confidently on the edge of a mid-rise city rooftop. Beside him stands the uploaded product at a matching giant scale, perfectly grounded on the rooftop surface with realistic shadows and reflections. His outfit is custom-designed using the product colors and subtle logo elements in a premium fashion style. The background shows a lively Indian city intersection below with moving traffic and people for scale. He looks directly into the camera with calm confidence. Lighting is soft golden daylight with crisp detail, realistic skin texture, subtle beard detail, and cinematic contrast. Camera angle: slightly low angle hero shot, 85mm lens, 8k, photorealistic commercial ad style.\n```\n\n### \ud83c\udfac Image-to-Video Animation Prompt:\n```text\nAnimate the uploaded image with a mostly static camera and subtle cinematic breathing motion. The giant Indian male model holds a calm pose and keeps direct eye contact with a confident half-smile. Add subtle wind movement in his clothes and hair. Down below, city traffic, bikes, and pedestrians move naturally. Add slight lighting shimmer on the product surface and natural environmental motion while keeping the scene grounded and realistic.\n```\n\n---\n\n## \ud83d\udca1 3. Product Emerging from Ocean\n- **Best Suited For**: `Beverages, skincare, perfume, summer products`\n\n### \ud83d\uddbc\ufe0f Image Generation Prompt:\n```text\nA dramatic ultra-photorealistic product advertisement showing the uploaded product rising from the ocean like a monumental sculpture. Splashing water forms elegant arcs around it, with realistic droplets frozen in midair. In the foreground, an Indian female model stands on a wet rocky surface in a flowing outfit designed with the product colors and branding accents. She looks toward the camera with a powerful expression as waves crash around the giant product. Lighting is sunrise golden hour with mist, reflections, and cinematic depth. Camera angle: low-angle hero shot, 50mm lens, hyper-real, premium ad aesthetic.\n```\n\n### \ud83c\udfac Image-to-Video Animation Prompt:\n```text\nAnimate the uploaded image with a steady cinematic camera. The ocean water moves continuously with realistic waves, splashes, and drifting mist. The model\u2019s outfit and hair move subtly in the sea breeze. Add sparkling water reflections on the product, gentle shifting clouds, and realistic motion in the surf while preserving the giant, epic product composition.\n```\n\n---\n\n## \ud83d\udca1 4. Product Breaking Through Ice\n- **Best Suited For**: `Cold drinks, energy drinks, skincare, cooling products`\n\n### \ud83d\uddbc\ufe0f Image Generation Prompt:\n```text\nA premium ultra-photorealistic commercial image of the uploaded product erupting through a massive block of ice, surrounded by flying crystal shards and frosty vapor. The scene is set in a dramatic cold environment with a powerful Indian model standing or sitting nearby, styled in a fashion look inspired by the product colors. The product appears huge and dominant, embedded in fractured ice with realistic reflections and refractions. Lighting is cool blue-white with crisp highlights and cinematic shadows. Camera angle: front hero shot, detailed macro realism mixed with large-scale advertising drama.\n```\n\n### \ud83c\udfac Image-to-Video Animation Prompt:\n```text\nAnimate the uploaded image with a locked camera. Add subtle motion to drifting cold vapor, tiny falling ice particles, sparkling reflections, and slight shimmer on the ice surfaces. Let the model\u2019s clothing and hair move gently in a cold breeze. Add very small cracking movement and micro-slides of frost for a premium frozen VFX feel.\n```\n\n---\n\n## \ud83d\udca1 5. Product in Desert Storm\n- **Best Suited For**: `Fragrance, rugged tech, adventure products, cars`\n\n### \ud83d\uddbc\ufe0f Image Generation Prompt:\n```text\nA cinematic ultra-photorealistic shot of the uploaded product towering in a vast desert landscape like a monumental object. Sand swirls around its base in elegant trails. An Indian model in a desert-inspired outfit tailored with the product palette stands beside it, looking strong and confident. The product is realistically grounded in the sand with soft shadows, detailed texture, and environmental integration. Warm sunlight, atmospheric haze, and a dramatic sky create a bold luxury-ad look. Camera setup: low-angle, 85mm lens, crisp natural lighting, high-end commercial realism.\n```\n\n### \ud83c\udfac Image-to-Video Animation Prompt:\n```text\nAnimate the uploaded image with a static or very subtle push-in camera. Sand particles drift naturally through the air, the model\u2019s outfit and hair move softly in the wind, and heat haze shimmers in the distance. Add slow cloud movement and subtle sunlight shifts across the product for a premium desert VFX effect.\n```\n\n---\n\n## \ud83d\udca1 6. Product in Flower Garden\n- **Best Suited For**: `Perfume, skincare, beauty, wellness products`\n\n### \ud83d\uddbc\ufe0f Image Generation Prompt:\n```text\nA dreamy ultra-photorealistic luxury ad showing the uploaded product standing giant among an abundant flower garden in bloom. Petals surround the product, and an Indian female model in an elegant floral-inspired outfit sits gracefully on a garden ledge beside it. Her dress incorporates the product colors and branding in a subtle premium way. The product is physically integrated into the scene with realistic shadows, highlights, and reflections. Lighting is soft morning daylight with delicate haze, vivid botanical detail, and premium beauty-ad styling. Camera angle: slightly low hero perspective with rich depth of field.\n```\n\n### \ud83c\udfac Image-to-Video Animation Prompt:\n```text\nAnimate the uploaded image with a gentle cinematic stillness. Flower petals float lightly in the air, leaves and blossoms sway in a soft breeze, and the model\u2019s hair and fabric move subtly. Add small sunlight flickers, shallow drifting haze, and natural environmental motion while keeping the product sharp and dominant.\n```\n\n---\n\n## \ud83d\udca1 7. Product on Busy Highway\n- **Best Suited For**: `Automotive, sneakers, tech, energy drinks`\n\n### \ud83d\uddbc\ufe0f Image Generation Prompt:\n```text\nAn ultra-photorealistic cinematic ad of the uploaded product placed giant at the center of a multilane urban highway interchange, integrated like a real monumental installation. Cars and motorbikes flow around it, grounding its scale. An Indian male or female model stands on an overpass in the foreground wearing a custom outfit inspired by the product color palette and logo accents. The product has premium reflections and realistic environmental shadowing. Lighting: dynamic late afternoon daylight with crisp contrast, realistic asphalt texture, and city depth. Camera: elevated hero angle, 8k realism.\n```\n\n### \ud83c\udfac Image-to-Video Animation Prompt:\n```text\nAnimate the uploaded image with a mostly static camera. Traffic moves smoothly around the giant product, headlights or sunlight reflections shift subtly, and the model\u2019s clothes and hair move naturally in the wind. Add ambient city motion and slight atmospheric haze for realism.\n```\n\n---\n\n## \ud83d\udca1 8. Product Floating in Cloudscape\n- **Best Suited For**: `Luxury products, perfume, skincare, tech launches`\n\n### \ud83d\uddbc\ufe0f Image Generation Prompt:\n```text\nA breathtaking premium ad image of the uploaded product placed on a giant floating platform above the clouds, with a photorealistic Indian model seated elegantly beside it. The model wears a couture outfit inspired by the product palette and branding. The sky is luminous, with cinematic clouds, soft sunlight, and airy grandeur. The product appears majestic, sharply detailed, and physically grounded on the cloud platform with elegant reflections. Mood: aspirational, clean, premium, photorealistic fantasy grounded in commercial realism.\n```\n\n### \ud83c\udfac Image-to-Video ting: fresh daylight with dramatic contrast and atmospheric depth. Camera: low-angle heroic composition, premium cinematic realism.\n```\n\n### \ud83c\udfac Image-to-Video Animation Prompt:\n```text\nAnimate the uploaded image with subtle cinematic realism. Clouds drift in the distance, the model\u2019s outfit and hair move in the mountain wind, and slight atmospheric haze travels across the scene. Add tiny movement in nearby grass or dust and natural light play on the product surface.\n```\n\n---\n\n## \ud83d\udca1 11. Product in Rainy Street Scene\n- **Best Suited For**: `Fashion, tech, perfume, lifestyle products`\n\n### \ud83d\uddbc\ufe0f Image Generation Prompt:\n```text\nA moody ultra-photorealistic ad showing the uploaded product giant in a wet urban street scene after rain. The asphalt reflects neon or soft city lights. An Indian model stands or sits under a transparent umbrella or in a raincoat-inspired couture outfit using product colors and subtle brand motifs. Rain droplets bead on the product, which is grounded realistically on the street. Reflections, puddles, and city background create a striking cinematic mood. Camera: street-level hero shot, rich contrast, premium realism.\n```\n\n### \ud83c\udfac Image-to-Video Animation Prompt:\n```text\nAnimate the uploaded image with soft rain falling, puddle ripples, subtle reflections shifting, and the model\u2019s hair or clothing moving slightly. Add occasional vehicle motion in the background and water droplets sliding over the product surface for a premium rainy VFX feel.\n```\n\n---\n\n## \ud83d\udca1 12. Product in Minimal White Studio Monument\n- **Best Suited For**: `Skincare, perfume, gadgets, luxury products`\n\n### \ud83d\uddbc\ufe0f Image Generation Prompt:\n```text\nA clean ultra-photorealistic studio advertisement featuring the uploaded product as a giant sculpture inside a seamless white architectural space with curved steps and geometric platforms. An Indian model in a minimalist high-fashion outfit inspired by the product palette poses elegantly beside it. The product receives soft premium reflections, realistic shadows, and immaculate lighting. Mood: clean, luxury, editorial, high-end commercial realism. Camera: precise hero framing with soft depth and pristine detail.\n```\n\n### \ud83c\udfac Image-to-Video Animation Prompt:\n```text\nAnimate the uploaded image with a very subtle camera drift or gentle locked-off feel. The model makes minimal natural micro-movements, fabric shifts slightly, and soft light subtly evolves across the studio surfaces. Keep the motion elegant and restrained.\n```\n\n---\n\n## \ud83d\udca1 13. Product on Giant Billboard Scene\n- **Best Suited For**: `Phones, apps, beverages, youth products`\n\n### \ud83d\uddbc\ufe0f Image Generation Prompt:\n```text\nA dynamic ultra-photorealistic city scene where the uploaded product appears giant on or emerging from a massive urban billboard in a busy Indian market or downtown district. An Indian model interacts with the billboard environment, sitting on the billboard edge or standing on a platform near the product. The surrounding streets are filled with life, traffic, and pedestrians for scale. Lighting is vibrant daylight or golden hour, with realistic signage reflections and depth. Camera: street-upward angle, dramatic ad realism.\n```\n\n### \ud83c\udfac Image-to-Video Animation Prompt:\n```text\nAnimate the uploaded image with natural street movement below: traffic, pedestrians, moving shadows, and tiny billboard light flickers if appropriate. The model holds a confident pose with slight cloth and hair motion. Add subtle environmental animation while preserving the bold giant billboard composition.\n```\n\n---\n\n## \ud83d\udca1 14. Product in Festival Scene\n- **Best Suited For**: `Beauty, sweets, beverages, fashion, festive brands`\n\n### \ud83d\uddbc\ufe0f Image Generation Prompt:\n```text\nA colorful ultra-photorealistic Indian festival-themed ad with the uploaded product displayed at giant scale in a decorated city square or palace courtyard. An Indian female model in a festive saree or lehenga designed with the product\u2019s color gradients and elegant logo patterns sits or stands beside the product. Decorative lights, marigolds, rangoli, or festive textures create a premium celebratory atmosphere. The product is grounded naturally with realistic lighting and reflections. Camera: front hero shot with cinematic vibrancy and rich detail.\n```\n\n### \ud83c\udfac Image-to-Video Animation Prompt:\n```text\nAnimate the uploaded image with soft festive environmental motion: hanging decorations sway slightly, lights twinkle subtly, small petals drift, and people or distant crowd activity moves naturally. The model keeps gentle eye contact and subtle micro-expressions while fabric moves softly.\n```\n\n---\n\n## \ud83d\udca1 15. Product in Futuristic Neon City\n- **Best Suited For**: `Tech, gaming, audio gear, premium gadgets`\n\n### \ud83d\uddbc\ufe0f Image Generation Prompt:\n```text\nAn ultra-photorealistic futuristic city ad with the uploaded product standing giant among sleek neon-lit architecture. A stylish Indian model in a fashion-forward outfit inspired by the product colors and logo details poses beside it with strong confidence. The wet reflective streets and glowing signs create a polished premium tech aesthetic. The product appears highly detailed with realistic reflections and integrated lighting. Camera: low-angle cyber-luxury hero shot, dramatic depth, premium commercial quality.\n```\n\n### \ud83c\udfac Image-to-Video Animation Prompt:\n```text\nAnimate the uploaded image with gentle neon flicker, passing vehicles or hover-like traffic motion, drifting mist, and slight movement in the model\u2019s clothing and hair. Add subtle environmental animation and reflective light changes across the product surface.\n```\n\n---\n\n## \ud83d\udca1 16. Product with Paint Splash Explosion\n- **Best Suited For**: `Beauty, beverages, lifestyle ant.\n```\n\n---\n\n## \ud83d\udca1 18. Product in Temple or Heritage Courtyard\n- **Best Suited For**: `Jewelry, beauty, ethnic fashion, premium Indian brands`\n\n### \ud83d\uddbc\ufe0f Image Generation Prompt:\n```text\nAn elegant ultra-photorealistic ad set in a grand Indian heritage courtyard or temple-inspired architectural space. The uploaded product appears large and luxuriously placed as the visual centerpiece. An Indian model in a refined saree or traditional couture outfit inspired by the product colors and logo elements stands or sits beside it. The scene features carved stone, heritage textures, warm daylight, and premium cultural richness without feeling kitsch. The product is grounded naturally with realistic contact shadows and reflections. Camera: dignified cinematic hero shot.\n```\n\n### \ud83c\udfac Image-to-Video Animation Prompt:\n```text\nAnimate the uploaded image with a subtle breeze moving fabric and hair, drifting dust motes or flower petals, and slow natural daylight changes. Add light environmental motion in the background while preserving the premium heritage atmosphere.\n```\n\n---\n\n## \ud83d\udca1 19. Product on Mirror Water Surface\n- **Best Suited For**: `Perfume, skincare, luxury, beauty launches`\n\n### \ud83d\uddbc\ufe0f Image Generation Prompt:\n```text\nA luxurious ultra-photorealistic ad with the uploaded product standing giant on a calm mirror-like water surface, perfectly reflected below. Beside it, an Indian model sits elegantly on a low platform or sculptural pedestal, wearing a couture outfit derived from the product colors and logo motifs. The environment is minimal yet cinematic, with open sky, soft haze, and clean high-end styling. The product and model are reflected beautifully in the water. Camera: clean hero angle with refined premium realism.\n```\n\n### \ud83c\udfac Image-to-Video Animation Prompt:\n```text\nAnimate the uploaded image with subtle ripples on the reflective water, gentle wind motion in the model\u2019s outfit and hair, and slow cloud drift above. Add slight shimmering highlights on the product and keep the overall motion calm, luxurious, and minimal.\n```\n\n---\n\n## \ud83d\udca1 20. Product in Giant Library / Knowledge Scene\n- **Best Suited For**: `Education apps, tools, books, AI products, SaaS`\n\n### \ud83d\uddbc\ufe0f Image Generation Prompt:\n```text\nA cinematic ultra-photorealistic concept ad featuring the uploaded product as a giant centerpiece in a beautiful grand library or knowledge-themed architectural environment. An Indian model sits casually on the edge of a high bookshelf or reading platform near the product, wearing a premium fashion outfit customized with the product colors and subtle branding accents. The space includes dramatic scale, warm daylight beams, rows of books, and rich wood or modern interiors. The product is integrated with realistic grounding, shadows, and reflections. Camera: slightly low-angle hero composition, premium storytelling ad style.\n```\n\n### \ud83c\udfac Image-to-Video Animation Prompt:\n```text\nAnimate the uploaded image with slow dust particles floating in light beams, soft page flutter or subtle environmental movement, and gentle motion in the model\u2019s clothing and hair. Add slight light shifts and preserve the scene as a premium storytelling-style product VFX shot.\n```\n\n---\n"}, {"filename": "\ud83d\udcdd 55_One_Word_ADS_Codes_Shortcuts.md", "title": "55 One Word ADS Codes Shortcuts", "content": "# \u26a1 ADS CODES: 55 One-Word Prompt Shortcuts for AI Ad & Product Visuals\n\n> **Original Source & Studio**: Rude Popcorn \u2014 AI Ad Studio \u00b7 Keep this handy, remix freely.  \n> **Compatible AI Models**: ChatGPT Image, Midjourney, Google Flow, Veo, Kling, Higgsfield, Stable Diffusion.  \n> **1-Click Copy**: Every prompt code block is formatted in a fenced code block with an instant GitHub Copy button!\n\n---\n\n## \ud83d\udca1 How to Use & Real Talk Guide\n\n`\text\nHow to use: type a code, then y
