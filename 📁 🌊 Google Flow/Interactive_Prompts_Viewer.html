fe0f Click to Watch Video Tutorial (43s)](https://files.catbox.moe/4lnv1u.mp4)  \n> **Category**: [\ud83d\udcc1 \ud83d\ude80 Product VFX & Video Commercials](../\ud83d\udcc1%20\ud83d\ude80%20Product%20VFX%20&%20Video%20Commercials/)\n\n---\n\n## \ud83c\udfac Video Tutorial (Tap to Play Instantly in Browser)\n\n[![\u25b6\ufe0f Click to Play Video Tutorial](\ud83d\uddbc\ufe0f%20Shoe_Commercial_Screenshots/00_Play_Video_Cover.jpg)](https://files.catbox.moe/4lnv1u.mp4)\n\n> \ud83d\udca1 **[\u25b6\ufe0f Click Image Above to Play Video with Sound, Seekbar & Controls (43s)](https://files.catbox.moe/4lnv1u.mp4)**\n\n---\n\n## \ud83d\ude80 Step 1: ChatGPT Me Shoes Storyboard Banayein\n\n1. ChatGPT me apne \u091c\u0942\u0924\u0947 / sneakers ki photo upload karein aur ye prompt dalein:\n\n![Upload Shoes](\ud83d\uddbc\ufe0f%20Shoe_Commercial_Screenshots/01_ChatGPT_Upload_Shoe.jpg)\n\n### \ud83d\udccb Copy Prompt:\n```text\n/adcreative /storyboard\n```\n\n2. ChatGPT turant 5-panel ka complete **Ad Storyboard Image** generate kar dega:\n\n![Shoe Storyboard Result](\ud83d\uddbc\ufe0f%20Shoe_Commercial_Screenshots/02_ChatGPT_Generated_Shoe_Storyboard.jpg)\n\n#### \u23f1\ufe0f 5-Shot Commercial Structure:\n* **Shot 1 (0-2s) - Hook**: Look at that sole (Dynamic shoe angle)\n* **Shot 2 (2-5s) - Feature Reveal**: Breathable mesh, premium laces, durable stripes, maximum cushion\n* **Shot 3 (5-9s) - Comfort Demo**: Soft, light, comfortable flex demo\n* **Shot 4 (9-12s) - Style Shot**: Athlete walking in city street (\"Built to stand out\")\n* **Shot 5 (12-15s) - Hero / CTA**: Product on pedestal (\"Your next favorite pair. Shop now ->\")\n\n---\n\n## \ud83c\udf0a Step 2: Google Flow Me Video Generate Karein\n\n1. Google Flow open karein aur ChatGPT se bani storyboard image upload karein.\n2. Ye 7 slash commands copy karke prompt box me paste karein:\n\n![Google Flow Upload & Codes](\ud83d\uddbc\ufe0f%20Shoe_Commercial_Screenshots/03_Google_Flow_Upload_And_Codes.jpg)\n\n### \ud83d\udccb Copy Flow Prompt:\n```text\n/ultraphotorealistic\n/orbitcamera\n/cinematiclighting\n/premiumcommercial\n/ultraphotorealistic\n/8kdetail\n/vertical9x16\n```\n\n3. Settings select karein:\n* **Mode**: `Video`\n* **Resolution**: `720p`\n* **Duration**: `10s`\n* **Quantity**: `x1`\n\n---\n\n## \ud83c\udfa5 Result: 3D Cinematic Commercial Video\n\nGoogle Flow storyboard ke har angle ko 3D motion, camera orbit aur lighting ke sath cinematic ad bana deta hai:\n\n| 3D Rotating Orbit with Sparks | Athlete Running on City Street |\n| :---: | :---: |\n| ![Sparks Orbit Video](\ud83d\uddbc\ufe0f%20Shoe_Commercial_Screenshots/04_Final_Video_Result_Sparks.jpg) | ![Runner Style Shot](\ud83d\uddbc\ufe0f%20Shoe_Commercial_Screenshots/05_Final_Video_Result_Runner.jpg) |\n| *Hero Pedestal Rotation with Particle Sparks* | *On-Street Comfort & Style Action Demo* |\n\n---\n\n*Curated for Satyender Parihar's Master Repository & Google Flow Video Studio.*\n"}, {"filename": "\ud83d\udcdd Google_Flow_Shop_Storefront_Cinematic_Video_Commands_Guide.md", "title": "Google Flow Shop Storefront Cinematic Video Commands Guide", "content": "# \ud83c\udfea Google Flow: 4 Cinematic Camera Commands for Shop & Storefront Ads\n\n> **Workflow**: Shop / Storefront Photo \u2794 Google Flow Camera Slash Commands \u2794 4 Instant Cinematic Ads  \n> **Direct Video Stream**: [\u25b6\ufe0f Click to Watch Video Tutorial (37s)](https://files.catbox.moe/bb1s6t.mp4)  \n> **Category**: [\ud83d\udcc1 \ud83d\ude80 Product VFX & Video Commercials](../\ud83d\udcc1%20\ud83d\ude80%20Product%20VFX%20&%20Video%20Commercials/)\n\n---\n\n## \ud83c\udfac Video Tutorial (Tap to Play Instantly in Browser)\n\n[![\u25b6\ufe0f Click to Play Video Tutorial](\ud83d\uddbc\ufe0f%20Storefront_Screenshots/00_Play_Video_Cover.jpg)](https://files.catbox.moe/bb1s6t.mp4)\n\n> \ud83d\udca1 **[\u25b6\ufe0f Click Image Above to Play Video with Sound, Seekbar & Controls (37s)](https://files.catbox.moe/bb1s6t.mp4)**\n\n---\n\n## \ud83d\ude80 4 Viral Storefront Camera Commands (1-Click Copy)\n\nGoogle Flow me apni shop ya storefront ki photo upload karein aur neeche diye gaye commands me se koi bhi command use karein:\n\n---\n\n### 1\ufe0f\u20e3 `/city fpv to storefront` (City Aerial Zoom to Storefront)\n\nIs command se aapki shop ko city ke sky aerial view se smoothly zoom-in cinematic drone shot milega:\n\n| Prompt Input | Video Output Result |\n| :---: | :---: |\n| ![City FPV Prompt](\ud83d\uddbc\ufe0f%20Storefront_Screenshots/01_City_FPV_Prompt.jpg) | ![City FPV Result](\ud83d\uddbc\ufe0f%20Storefront_Screenshots/02_City_FPV_Result.jpg) |\n\n#### \ud83d\udccb Copy Command:\n```text\n/city fpv to storefront\n```\n\n---\n\n### 2\ufe0f\u20e3 `/mannequin to runway` (Mannequin Fashion Runway Transformation)\n\nIs command se aapki shop aur product ka mannequin-style display direct runway fashion show me transform ho jayega:\n\n| Prompt Input | Video Output Result |\n| :---: | :---: |\n| ![Mannequin Prompt](\ud83d\uddbc\ufe0f%20Storefront_Screenshots/03_Mannequin_To_Runway_Prompt.jpg) | ![Mannequin Result](\ud83d\uddbc\ufe0f%20Storefront_Screenshots/04_Mannequin_To_Runway_Result.jpg) |\n\n#### \ud83d\udccb Copy Command:\n```text\n/mannequin to runway\n```\n\n---\n\n### 3\ufe0f\u20e3 `/hyperlapse orbit` (Fast 360\u00b0 Orbit Around Storefront)\n\nIs command se fast hyperlapse camera movement ke sath storefront ya product ke chaaron taraf dynamic orbit shot create hoga:\n\n| Prompt Input | Video Output Result |\n| :---: | :---: |\n| ![Hyperlapse Prompt](\ud83d\uddbc\ufe0f%20Storefront_Screenshots/05_Hyperlapse_Orbit_Prompt.jpg) | ![Hyperlapse Result](\ud83d\uddbc\ufe0f%20Storefront_Screenshots/06_Hyperlapse_Orbit_Result.jpg) |\n\n#### \ud83d\udccb Copy Command:\n```text\n/hyperlapse orbit\n```\n\n---\n\n### 4\ufe0f\u20e3 `/fpv fly-through` (Fast FPV Flying Inside the Store)\n\nIs command se first-person FPV drone camera direct shop ke glass door ke through andar enter karke interior racks aur display showcase karega:\n\n| Prompt Input | Video Output Result |\n| :---: | :---: |\n| ![FPV Fly Through Prompt](\ud83d\uddbc\ufe0f%20Storefront_Screenshots/07_FPV_Fly_Through_Prompt.jpg) | ![FPV Fly Through Result](\ud83d\uddbc\ufe0f%20Storefront_Screenshots/08_FPV_Fly_Through_Result.jpg) |\n\n#### \ud83d\udccb Copy Command:\n```text\n/fpv fly-through\n```\n\n---\n\n## \u2699\ufe0f Google Flow Video Settings\n* **Mode**: `Video`\n* **Resolution**: `720p`\n* **Duration**: `8s`\n* **Multiplier**: `x1`\n\n---\n\n*Curated for Satyender Parihar's Master Repository & Google Flow Video Studio.*\n"}, {"filename": "\ud83d\udcdd Product_Video_Commands_Directory_592.md", "title": "Product Video Commands Directory 592", "content": "# \ud83d\ude80 Product Video Commands Directory (592 Ready Shortcuts)\n\n> **Source**: Complete Un-Truncated Extraction from Product Video Commands.xlsx (Sheet 1)  \n> **Categories**: 36 Production Categories covering Camera, VFX, Lighting, Cinematic, Drone & UGC  \n> **1-Click Copy**: Every prompt command is formatted in a fenced code block with a dedicated GitHub Copy button!\n\n---\n\n## \ud83d\udcd1 Table of Contents\n\n1. [Effects, Reveals & Advertising (19 Commands)](#effects-reveals--advertising)\n2. [Cinematic & Movie Styles (15 Commands)](#cinematic--movie-styles)\n3. [Visual Effects, Weather & Atmosphere (15 Commands)](#visual-effects-weather--atmosphere)\n4. [Luxury & Product Marketing (15 Commands)](#luxury--product-marketing)\n5. [Product Ads & Lifestyle (15 Commands)](#product-ads--lifestyle)\n6. [Futuristic & Fantasy (15 Commands)](#futuristic--fantasy)\n7. [Viral & Creative Styles (14 Commands)](#viral--creative-styles)\n8. [Transitions (40 Commands)](#transitions)\n9. [Outfit & Fashion (20 Commands)](#outfit--fashion)\n10. [Best Combo Examples (4 Commands)](#best-combo-examples)\n11. [Editing & Transformation (20 Commands)](#editing--transformation)\n12. [Fantasy, Animation & Retro Styles (20 Commands)](#fantasy-animation--retro-styles)\n13. [Creator & function renderTabs() {
  const bar = document.getElementById('tabBar');
  data.forEach((cat, idx) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.textContent = cat.name;
    btn.onclick = () => selectTab(cat.name);
    bar.appendChild(btn);
  });
}

let activeCategory = 'ALL';

function selectTab(catName) {
  activeCategory = catName;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === catName || (catName === 'ALL' && btn.textContent === 'All Categories'));
  });
  renderContent();
}

function copyPrompt(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 1600);
    const old = btn.textContent;
    btn.textContent = 'Copied! ✓';
    setTimeout(() => btn.textContent = old, 1500);
  });
}

function renderContent() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const area = document.getElementById('contentArea');
  area.innerHTML = '';

  data.forEach(cat => {
    if (activeCategory !== 'ALL' && activeCategory !== cat.name) return;
    
    cat.files.forEach(file => {
      if (query && !file.title.toLowerCase().includes(query) && !file.content.toLowerCase().includes(query)) return;
      
      const card = document.createElement('div');
      card.className = 'file-card';
      
      const title = document.createElement('div');
      title.className = 'file-title';
      title.innerHTML = '<span>📄 ' + file.title + '</span><span style="font-size:0.75rem;color:var(--primary)">' + cat.name + '</span>';
      card.appendChild(title);

      // Extract markdown code blocks or text chunks
      const codeRegex = //g;
      let match;
      let count = 0;
      while ((match = codeRegex.exec(file.content)) !== null) {
        const promptStr = match[1].trim();
        if (promptStr.length > 20) {
          count++;
          const block = document.createElement('div');
          block.className = 'prompt-block';
          
          const btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.textContent = 'Copy';
          btn.onclick = () => copyPrompt(btn, promptStr);
          block.appendChild(btn);

          const pre = document.createElement('div');
          pre.className = 'prompt-text';
          pre.textContent = promptStr;
          block.appendChild(pre);
          
          card.appendChild(block);
        }
      }

      // If no code blocks, show first 1000 characters
      if (count === 0) {
        const block = document.createElement('div');
        block.className = 'prompt-block';
        const pre = document.createElement('div');
        pre.className = 'prompt-text';
        pre.textContent = file.content.substring(0, 1500) + '...';
        block.appendChild(pre);
        card.appendChild(block);
      }

      area.appendChild(card);
    });
  });
}

function filterPrompts() {
  renderContent();
}

renderTabs();
renderContent();
